version: '3.8'

services:
  uzum-shop-bot:
    build: .
    container_name: uzum-shop-bot
    restart: unless-stopped
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
